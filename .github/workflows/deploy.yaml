name: Build and Push to Docker Hub

on:
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: 'Docker Image Tag'
        required: false
        type: string
        default: ''

jobs:
  push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker image tag calculation
        run: |
          INPUT_DOCKER_IMAGE_TAG="${{ inputs.docker_image_tag }}"
          echo "Input Docker Image Tag: ${INPUT_DOCKER_IMAGE_TAG}"
          DOCKER_IMAGE_TAG="${INPUT_DOCKER_IMAGE_TAG:-$(date -u +'%Y%m%d%H%M%S')}" >> $GITHUB_ENV
          echo "Docker Image Tag: ${DOCKER_IMAGE_TAG}"

      - name: Build Custom Renovate Image
        run: docker build -t "arkadiusjonczek/ast-grep:${DOCKER_IMAGE_TAG}" .

      - name: Scan for Critical CVEs
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest image --exit-code 1 --severity CRITICAL "arkadiusjonczek/ast-grep:${DOCKER_IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: "arkadiusjonczek/ast-grep:${DOCKER_IMAGE_TAG}"
